<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Thư viện flashcard</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header>
      <nav>
        <div class="brand">Flashcard Study</div>
        <div class="nav-links">
          <a href="create.html">Tạo bộ</a>
          <a href="library.html">Thư viện</a>
          <a href="study.html">Học ngay</a>
        </div>
      </nav>
    </header>

    <main>
      <section class="hero">
        <h1>Chọn bộ flashcard để học</h1>
        <p>Danh sách các bộ thẻ đã tạo, sẵn sàng để bắt đầu học bất cứ lúc nào.</p>
        <div class="actions">
          <a class="btn" href="create.html">Tạo bộ mới</a>
          <a class="btn secondary" href="study.html">Bắt đầu học</a>
        </div>
      </section>

      <section class="panel">
        <h2>Danh sách bộ flashcard</h2>
        <div class="deck-list">
          <div class="deck-item">
            <div>
              <strong>Bộ 1: Lý thuyết cơ bản</strong>
              <span>8 thẻ</span>
            </div>
            <a class="btn" href="study.html">Chọn</a>
          </div>
          <div class="deck-item">
            <div>
              <strong>Bộ 2: Ôn tập giữa kỳ</strong>
              <span>12 thẻ</span>
            </div>
            <a class="btn" href="study.html">Chọn</a>
          </div>
          <div class="deck-item">
            <div>
              <strong>Bộ 3: Câu hỏi mẫu</strong>
              <span>5 thẻ</span>
            </div>
            <a class="btn" href="study.html">Chọn</a>
          </div>
        </div>
      </section>
    </main>
  </body>
</html>
