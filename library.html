<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Flashcard Library</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header>
      <nav>
        <div class="brand">Flashcard Study</div>
        <div class="nav-links">
          <a href="create.html">Create Deck</a>
          <a href="library.html">Library</a>
          <a href="study.html">Study Now</a>
        </div>
      </nav>
    </header>

    <main>
      <section class="hero">
        <h1>Choose a Flashcard Deck to Study</h1>
        <p>A list of your created decks, ready to study anytime.</p>
        <div class="actions">
          <a class="btn" href="create.html">Create New Deck</a>
          <a class="btn secondary" href="study.html">Start Studying</a>
        </div>
      </section>

      <section class="panel">
        <h2>Flashcard Decks</h2>
        <div class="deck-list">
          <div class="deck-item">
            <div>
              <strong>Deck 1: Basic Theory</strong>
              <span>8 cards</span>
            </div>
            <a class="btn" href="study.html">Select</a>
          </div>
          <div class="deck-item">
            <div>
              <strong>Deck 2: Midterm Review</strong>
              <span>12 cards</span>
            </div>
            <a class="btn" href="study.html">Select</a>
          </div>
          <div class="deck-item">
            <div>
              <strong>Deck 3: Sample Questions</strong>
              <span>5 cards</span>
            </div>
            <a class="btn" href="study.html">Select</a>
          </div>
        </div>
      </section>
    </main>
  </body>
</html>
