<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Create Flashcard Deck</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header>
      <nav>
        <div class="brand">Flashcard Study</div>
        <div class="nav-links">
          <a href="create.html">Create Deck</a>
          <a href="library.html">Library</a>
          <a href="study.html">Study Now</a>
        </div>
      </nav>
    </header>

    <main>
      <section class="hero">
        <h1>Create a New Flashcard Deck</h1>
        <p>Enter your questions and answers, then save them to study later.</p>
        <div class="actions">
          <a class="btn" href="library.html">View Library</a>
        </div>
      </section>

      <section class="panel">
        <h2>Deck Information</h2>
        <label>
          Deck Name
          <input type="text" placeholder="e.g. Week 1 Theory" />
        </label>
        <label>
          Question
          <textarea placeholder="Enter the question"></textarea>
        </label>
        <label>
          Answer
          <textarea placeholder="Enter the answer"></textarea>
        </label>
        <label>
          Upload Theory File
          <input type="file" />
        </label>
        <button class="btn">Save Deck</button>
      </section>
    </main>
  </body>
</html>
