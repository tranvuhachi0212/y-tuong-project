<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Flashcard Theory Study</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header>
      <nav>
        <div class="brand">🐱 Hello Kitty Flashcards</div>
        <div class="nav-links">
          <button class="nav-btn" data-target="createSection">Create Deck</button>
          <button class="nav-btn" data-target="librarySection">Library</button>
          <button class="nav-btn" data-target="studySection">Study Now</button>
        </div>
      </nav>
    </header>

    <main>
      <section class="hero">
        <h1>Learn theory fast, just like Quizlet</h1>
        <p>Break content into questions and answers, easy to learn, easy to review, and easy to track progress.</p>
        <div id="heroStats" class="stats"></div>
      </section>

      <section class="panel active-panel" id="createSection">
        <h2>Create Flashcard Deck</h2>
        <form id="deckForm">
          <label>
            Deck Name
            <input id="deckName" type="text" placeholder="e.g. Week 1 Theory" required />
          </label>
          <div id="cardInputs"></div>
          <div class="actions">
            <button type="button" id="addCardBtn" class="btn secondary">+ Add Card</button>
            <button type="submit" class="btn">Save Deck</button>
          </div>
          <p id="formMessage" class="form-message"></p>
        </form>
      </section>

      <section class="panel" id="librarySection">
        <div class="section-header">
          <h2>Flashcard Library</h2>
          <button id="clearAllBtn" class="btn secondary">Delete All</button>
        </div>
        <div id="libraryList" class="deck-list"></div>
      </section>

      <section class="panel" id="studySection">
        <h2>Study Flashcards</h2>
        <div id="studyStatus"></div>
        <div id="studyCard" class="flashcard-card"></div>
        <div id="likeIndicator" class="like-indicator"></div>
        <div class="actions study-actions">
          <button id="showAnswerBtn" class="btn">Show Answer</button>
          <button id="rememberBtn" class="btn secondary">Remembered</button>
          <button id="reviewBtn" class="btn secondary">Need Review</button>
        </div>
        <div class="actions study-actions">
          <button id="backBtn" class="btn secondary">Back</button>
          <button id="nextBtn" class="btn">Next</button>
        </div>
        <div id="studySummary"></div>
      </section>
    </main>

    <script src="app.js"></script>
  </body>
</html>
